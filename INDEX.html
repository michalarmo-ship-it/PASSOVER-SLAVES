<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עבדים היינו במצרים - משחק חיפוש</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&family=Suez+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#E8A838;--gold-light:#F5D48A;--sand:#F5E6C8;--brown:#8B5E3C;--brown-dark:#5C3A1E;--nile:#3A8CB5;--nile-light:#6BB8D9;--papyrus:#F7F0DD;--green:#4CAF50}
body{font-family:'Rubik',sans-serif;background:linear-gradient(135deg,var(--sand) 0%,var(--gold-light) 50%,var(--sand) 100%);height:100vh;height:100dvh;overflow:hidden;direction:rtl;display:flex;align-items:center;justify-content:center}
.game-wrapper{display:flex;flex-direction:column;padding:4px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden}
.game-header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap;padding:6px 12px;background:linear-gradient(135deg,var(--brown-dark),var(--brown));border-radius:12px;margin-bottom:4px;box-shadow:0 4px 15px rgba(0,0,0,0.2);width:100%;flex-shrink:0}
.game-title{font-family:'Suez One',serif;color:var(--gold);font-size:clamp(1rem,2.5vw,1.3rem)}
.header-controls{display:flex;align-items:center;gap:8px}
.progress-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);padding:5px 12px;border-radius:20px}
.progress-bar{width:80px;height:10px;background:rgba(255,255,255,0.15);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:5px;transition:width 0.5s ease;width:0%}
.progress-text{color:var(--gold-light);font-weight:700;font-size:0.85rem;white-space:nowrap}
.ctrl-btn{border:none;padding:6px 14px;font-size:0.85rem;font-family:'Rubik',sans-serif;font-weight:600;border-radius:18px;cursor:pointer;transition:all 0.3s;color:white}
.ctrl-btn:hover{transform:scale(1.05)}
.hint-btn{background:linear-gradient(135deg,var(--nile),var(--nile-light))}
.hint-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.mag-btn{background:linear-gradient(135deg,var(--brown),#6B4226)}
.mag-btn.active{background:linear-gradient(135deg,var(--gold),#D4922A);box-shadow:0 0 10px rgba(232,168,56,0.5)}
.instruction-bar{width:100%;background:var(--papyrus);border:2.5px solid var(--gold);border-radius:12px;padding:8px 14px;margin-bottom:4px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(0,0,0,0.08);min-height:42px;transition:all 0.3s;flex-shrink:0}
.play-audio-btn{width:38px;height:38px;min-width:38px;border-radius:50%;border:2.5px solid var(--gold);background:linear-gradient(135deg,var(--gold),#D4922A);color:white;font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;box-shadow:0 3px 10px rgba(232,168,56,0.3)}
.play-audio-btn:hover{transform:scale(1.1)}
.play-audio-btn.playing{animation:audioPlaying 1s ease-in-out infinite}
@keyframes audioPlaying{0%,100%{box-shadow:0 0 0 0 rgba(232,168,56,0.4)}50%{box-shadow:0 0 0 10px rgba(232,168,56,0)}}
.instruction-text{font-size:clamp(0.75rem,1.8vw,0.95rem);font-weight:700;color:var(--brown-dark);line-height:1.2;white-space:nowrap}
.instruction-bar.success{border-color:var(--green);background:#E8F5E9}
.instruction-bar.success .instruction-text{color:var(--green)}
.image-container{position:relative;width:100%;flex:1;min-height:0;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.25);border:3px solid var(--gold);cursor:crosshair}
.image-container img{display:block;width:100%;height:100%;object-fit:contain}
.found-marker{position:absolute;pointer-events:none;z-index:12;display:flex;align-items:center;justify-content:center}
.found-marker .check-circle{width:40px;height:40px;background:rgba(76,175,80,0.8);border:3px solid var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:1.4rem;font-weight:800;animation:popIn 0.4s ease}
.fact-bubble-marker{position:absolute;width:3vmin;height:3vmin;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:15;transition:all 0.3s;border:none}
.fact-bubble-marker:hover{animation:hotspot-pulse 1.5s ease-in-out infinite;background:rgba(255,255,255,0.2);box-shadow:0 0 10px rgba(255,255,255,0.3)}
@keyframes hotspot-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.3)}50%{box-shadow:0 0 0 1.5vmin rgba(255,255,255,0)}}
@keyframes hotspot-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.3)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.hint-glow{position:absolute;border-radius:50%;pointer-events:none;z-index:11;animation:hintPulse 1.2s ease-in-out 4}
.magnifier{display:none;position:absolute;width:150px;height:150px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 0 3px var(--brown-dark),0 8px 25px rgba(0,0,0,0.4),inset 0 0 15px rgba(255,255,255,0.1);pointer-events:none;z-index:50;overflow:hidden;background-repeat:no-repeat}
.magnifier.visible{display:block}
.magnifier::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.25) 0%,transparent 60%);pointer-events:none}
.magnifier::before{content:'';position:absolute;bottom:-16px;right:-10px;width:12px;height:32px;background:linear-gradient(135deg,var(--brown),var(--brown-dark));border-radius:0 0 6px 6px;transform:rotate(-45deg);transform-origin:top center;box-shadow:2px 2px 5px rgba(0,0,0,0.3)}
.image-container.mag-active{cursor:none}
.wrong-flash{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #D94E4E;background:rgba(217,78,78,0.2);pointer-events:none;z-index:20;animation:wrongPop 0.6s ease forwards}
@keyframes wrongPop{0%{transform:scale(0.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;animation:fadeIn 0.3s ease}
.popup-overlay.active{display:flex}
.popup{background:white;border-radius:24px;padding:28px;max-width:400px;width:90vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);border:3px solid var(--nile);animation:popIn 0.4s ease}
.popup-emoji{font-size:3rem;margin-bottom:8px}
.popup-title{font-family:'Suez One',serif;font-size:1.5rem;color:var(--nile);margin-bottom:8px}
.popup-desc{font-size:1rem;color:var(--brown);line-height:1.6;margin-bottom:15px}
.fact-link{display:inline-block;padding:8px 20px;background:linear-gradient(135deg,var(--nile),var(--nile-light));color:white;text-decoration:none;border-radius:25px;font-weight:600;transition:all 0.3s}
.fact-link:hover{transform:scale(1.05)}
.popup-close{display:inline-block;margin-top:12px;background:var(--gold);color:white;border:none;padding:8px 24px;font-size:1rem;font-family:'Rubik',sans-serif;font-weight:700;border-radius:25px;cursor:pointer;transition:all 0.3s}
.popup-close:hover{background:#D4922A}
.win-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center}
.win-overlay.active{display:flex}
.win-card{background:linear-gradient(135deg,var(--papyrus),white);border-radius:30px;padding:35px;text-align:center;max-width:420px;width:90vw;box-shadow:0 20px 60px rgba(0,0,0,0.3);border:4px solid var(--gold);animation:popIn 0.5s ease}
.win-emoji{font-size:3.5rem;margin-bottom:12px}
.win-title{font-family:'Suez One',serif;font-size:1.8rem;color:var(--brown-dark);margin-bottom:8px}
.win-msg{font-size:1.05rem;color:var(--brown);line-height:1.6;margin-bottom:18px}
.win-btn{background:linear-gradient(135deg,var(--gold),#D4922A);color:white;border:none;padding:14px 40px;font-size:1.2rem;font-family:'Rubik',sans-serif;font-weight:700;border-radius:30px;cursor:pointer;transition:all 0.3s}
.win-btn:hover{transform:scale(1.05)}
.confetti-piece{position:fixed;z-index:250;pointer-events:none;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-20vh) rotate(0deg)}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,168,56,0)}50%{box-shadow:0 0 30px 15px rgba(232,168,56,0.6)}}
/* Phone portrait */
@media(max-width:480px){
  .game-wrapper{padding:2px}
  .game-header{padding:4px 8px;gap:3px;border-radius:8px;margin-bottom:2px}
  .game-title{font-size:0.75rem}
  .progress-bar{width:40px;height:8px}
  .progress-text{font-size:0.65rem}
  .progress-pill{padding:3px 8px}
  .ctrl-btn{font-size:0.6rem;padding:3px 6px;border-radius:12px}
  .instruction-bar{padding:4px 8px;gap:5px;min-height:30px;margin-bottom:2px;border-radius:8px}
  .instruction-text{font-size:0.65rem}
  .play-audio-btn{width:26px;height:26px;min-width:26px;font-size:0.8rem;border-width:2px}
  .magnifier{width:90px;height:90px}
  .fact-bubble-marker{width:18px;height:18px;font-size:10px}
  .image-container{border-width:2px;border-radius:8px}
}
/* Phone landscape & small tablets */
@media(min-width:481px) and (max-width:768px){
  .game-wrapper{padding:3px}
  .game-header{padding:5px 10px;gap:4px}
  .game-title{font-size:0.85rem}
  .progress-bar{width:50px}
  .progress-text{font-size:0.7rem}
  .ctrl-btn{font-size:0.7rem;padding:4px 8px}
  .instruction-bar{padding:5px 10px;min-height:34px;margin-bottom:3px}
  .play-audio-btn{width:30px;height:30px;min-width:30px;font-size:0.9rem}
  .magnifier{width:110px;height:110px}
  .fact-bubble-marker{width:22px;height:22px;font-size:12px}
}
/* Tablet & desktop */
@media(min-width:769px){
  .game-header{padding:8px 14px;gap:8px}
  .game-title{font-size:1.1rem}
  .progress-bar{width:80px}
  .ctrl-btn{font-size:0.85rem;padding:6px 14px}
  .instruction-bar{padding:8px 14px;min-height:42px}
  .play-audio-btn{width:36px;height:36px;min-width:36px;font-size:1.1rem}
}
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-header">
    <span class="game-title">🏺 עבדים היינו במצרים</span>
    <div class="header-controls">
      <div class="progress-pill">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">0 / 9</span>
      </div>
      <button class="ctrl-btn hint-btn" id="hintBtn" onclick="giveHint()">💡 רמז</button>
      <button class="ctrl-btn mag-btn" id="magBtn" onclick="toggleMagnifier()">🔍</button>
    </div>
  </div>
  <div class="instruction-bar" id="instructionBar">
    <button class="play-audio-btn" id="playBtn" onclick="replayAudio()">🔊</button>
    <span class="instruction-text" id="instructionText">לחצו על ▶ כדי להתחיל</span>
  </div>
  <div class="image-container" id="imageContainer">
    <img id="gameImg" alt="סצנת מצרים">
    <div class="magnifier" id="magnifier"></div>
  </div>
</div>
<div class="popup-overlay" id="factPopup">
  <div class="popup">
    <div class="popup-emoji" id="factEmoji">📚</div>
    <div class="popup-title" id="factTitle"></div>
    <div class="popup-desc" id="factDesc"></div>
    <a class="fact-link" id="factLink" href="#" target="_blank">🔗 ללמוד עוד!</a><br>
    <button class="popup-close" onclick="closeFactPopup()">חזרה למשחק</button>
  </div>
</div>
<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji">🎉🏆🎉</div>
    <div class="win-title">כל הכבוד!</div>
    <div class="win-msg">מצאתם את כל הפריטים בתמונה!<br>עכשיו אתם מכירים את החיים במצרים העתיקה.</div>
    <button class="win-btn" onclick="restartGame()">🔄 שחקו שוב!</button>
  </div>
</div>
<script>
// Dynamic sizing: fit everything in viewport
function sizeGame(){
  const vh=window.innerHeight;
  const vw=window.innerWidth;
  const wrapper=document.querySelector('.game-wrapper');
  // Image is square, so max width = available height minus header+instruction (~80px)
  const imgSpace=vh-90;
  const maxW=Math.min(vw-8, imgSpace, 800);
  wrapper.style.width=maxW+'px';
}
window.addEventListener('resize',sizeGame);
window.addEventListener('orientationchange',()=>setTimeout(sizeGame,100));
document.addEventListener('DOMContentLoaded',sizeGame);

document.getElementById('gameImg').src=IMAGE_SRC;
const TOTAL_STEPS=9;
const steps=[
  {audio:'SUN.mp4',text:'לחצו על השמש',hint:'☀️',cx:193,cy:131},
  {audio:'CAMEL.mp4',text:'לחצו על גמל',hint:'🐪',cx:670,cy:239},
  {audio:'DUCK.mp4',text:'לחצו על הברווז הרחוק',hint:'🦆',cx:107,cy:370},
  {audio:'CAT.mp4',text:'לחצו על החתול האפור',hint:'🐱',cx:953,cy:201},
  {audio:'FLOWER.mp4',text:'לחצו על הפרח הגדול',hint:'🌸',cx:91,cy:915},
  {audio:'BRICKS.mp4',text:'לחצו על האיש שסוחב לבני בנייה',hint:'🧱',cx:571,cy:395},
  {audio:'SPIDER.mp4',text:'לחצו על העכביש',hint:'🕷️',cx:999,cy:424},
  {audio:'ROPE.mp4',text:'לחצו על החבל שמאחורי הילדה שמשחקת בבובה',hint:'🪢',cx:620,cy:890},
  {audio:'YELLING.mp4',text:'לחצו על האיש שצועק',hint:'😠',cx:739,cy:497},
];
const facts=[
  {emoji:'🐱',title:'חתולים קדושים',text:'המצרים האמינו שחתולים הם חיות קדושות — אף אחד לא הרשה לפגוע בהם!',link:'https://kids.nationalgeographic.com/pages/article/cats-rule-in-ancient-egypt',x:92.6,y:2.7},
  {emoji:'🧱',title:'לבנים מבוץ וקש',text:'העבדים לשו בוץ וקש ביחד ומילאו תבניות — ככה הכינו לבנים! בלי קש זה נשבר מהר.',link:'https://youtube.com/shorts/-WtqJ55k5XM',x:45.1,y:25.9},
  {emoji:'🌊',title:'הנילוס = נהר החיים',text:'הנילוס הוא הנהר הכי ארוך בעולם! המצרים קראו לו "נהר החיים" כי בלעדיו שום דבר לא גדל.',link:'https://sciencekids.co.nz/videos/earth/nileriver.html',x:16.1,y:41.2},
  {emoji:'🧸',title:'ילדים שיחקו!',text:'גם ילדים במצרים שיחקו! הם גילפו בובות מעץ ושיחקו במשחקי לוח — ממש כמו ילדים היום!',link:'https://slpmiki.my.canva.site/the-ancient-toybox-pptx',x:82,y:65.4},
];
let currentStep=0,hintLevel=0,magActive=false,audioEl=null;
const ZOOM=2.5;
const hitCanvas=document.createElement('canvas');
hitCanvas.width=1024;hitCanvas.height=1024;
const hitCtx=hitCanvas.getContext('2d',{willReadFrequently:true});
const hitImg=new Image();
hitImg.src=HITMAP_SRC;
hitImg.onload=()=>{hitCtx.drawImage(hitImg,0,0)};

// Helper: get actual image rect within container (accounting for object-fit:contain)
function getImgRect(){
  const c=document.getElementById('imageContainer');
  const img=document.getElementById('gameImg');
  const cRect=c.getBoundingClientRect();
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const cw=cRect.width, ch=cRect.height;
  const scale=Math.min(cw/iw, ch/ih);
  const rw=iw*scale, rh=ih*scale;
  const ox=(cw-rw)/2, oy=(ch-rh)/2;
  return {ox,oy,rw,rh};
}

function buildGame(){
  const c=document.getElementById('imageContainer');

  facts.forEach(f=>{const e=document.createElement('div');e.className='fact-bubble-marker';e.dataset.fact=JSON.stringify(f);e.innerHTML='';c.appendChild(e);});

  // Position fact bubbles relative to actual image
  function positionFacts(){
    const ir=getImgRect();
    document.querySelectorAll('.fact-bubble-marker').forEach(el=>{
      const f=JSON.parse(el.dataset.fact);
      el.style.left=(ir.ox + f.x/100*ir.rw)+'px';
      el.style.top=(ir.oy + f.y/100*ir.rh)+'px';
    });
  }
  new ResizeObserver(positionFacts).observe(c);
  setTimeout(positionFacts,100);

  c.addEventListener('click',e=>{
    if(currentStep>=TOTAL_STEPS)return;
    const cRect=c.getBoundingClientRect();
    const cx=e.clientX-cRect.left,cy=e.clientY-cRect.top;
    const ir=getImgRect();
    // Map to 1024x1024 hitmap
    const hx=Math.round((cx-ir.ox)/ir.rw*1024),hy=Math.round((cy-ir.oy)/ir.rh*1024);
    if(hx<0||hx>=1024||hy<0||hy>=1024)return;
    const p=hitCtx.getImageData(hx,hy,1,1).data;
    const hitStep=Math.round(p[0]/28);
    if(hitStep===currentStep+1){handleHit(cx,cy,cRect);return}
    // If not a hit, check if clicked a fact bubble
    const factEl=e.target.closest('.fact-bubble-marker');
    if(factEl&&factEl.dataset.fact){
      showFact(JSON.parse(factEl.dataset.fact));return;
    }
    showWrongClick(cx,cy,c);
  });
  activateStep(0);
}
function activateStep(i){
  currentStep=i;hintLevel=0;
  document.getElementById('hintBtn').textContent='💡 רמז';
  document.getElementById('hintBtn').disabled=false;
  document.getElementById('instructionBar').classList.remove('success');
  document.getElementById('instructionText').textContent=steps[i].text;
  playStepAudio(i);
}
function playStepAudio(i){
  if(audioEl){audioEl.pause();audioEl=null}
  audioEl=new Audio(encodeURI(steps[i].audio));
  const b=document.getElementById('playBtn');b.classList.add('playing');
  audioEl.play().catch(()=>{});
  audioEl.onended=()=>b.classList.remove('playing');
  audioEl.onerror=()=>b.classList.remove('playing');
}
function replayAudio(){if(currentStep<TOTAL_STEPS)playStepAudio(currentStep)}
function handleHit(x,y){
  const c=document.getElementById('imageContainer');
  const m=document.createElement('div');m.className='found-marker';
  m.style.left=(x-20)+'px';m.style.top=(y-20)+'px';
  m.innerHTML='<div class="check-circle">✓</div>';c.appendChild(m);
  stepComplete();
}
function stepComplete(){
  document.getElementById('instructionBar').classList.add('success');
  document.getElementById('instructionText').textContent='מצאתם! יופי!';
  const d=currentStep+1;
  document.getElementById('progressFill').style.width=(d/TOTAL_STEPS*100)+'%';
  document.getElementById('progressText').textContent=d+' / '+TOTAL_STEPS;
  if(d>=TOTAL_STEPS){setTimeout(showWin,1200);return}
  setTimeout(()=>activateStep(currentStep+1),1500);
}
function showWrongClick(x,y,c){
  const f=document.createElement('div');f.className='wrong-flash';
  f.style.left=(x-20)+'px';f.style.top=(y-20)+'px';
  c.appendChild(f);setTimeout(()=>f.remove(),600);
}
function giveHint(){
  if(currentStep>=TOTAL_STEPS)return;
  const s=steps[currentStep];
  if(hintLevel===0){hintLevel=1;document.getElementById('instructionText').textContent=s.text+'  '+s.hint;document.getElementById('hintBtn').textContent='💡 רמז 2'}
  else if(hintLevel===1){
    hintLevel=2;document.getElementById('hintBtn').disabled=true;document.getElementById('hintBtn').textContent='💡';
    const c=document.getElementById('imageContainer');
    const ir=getImgRect();
    const dx=ir.ox+s.cx/1024*ir.rw,dy=ir.oy+s.cy/1024*ir.rh;
    const g=document.createElement('div');g.className='hint-glow';
    g.style.left=(dx-30)+'px';g.style.top=(dy-30)+'px';g.style.width='60px';g.style.height='60px';
    c.appendChild(g);setTimeout(()=>g.remove(),5000);
  }
}
function showFact(f){document.getElementById('factEmoji').textContent=f.emoji;document.getElementById('factTitle').textContent=f.title;document.getElementById('factDesc').textContent=f.text;document.getElementById('factLink').href=f.link;document.getElementById('factPopup').classList.add('active')}
function closeFactPopup(){document.getElementById('factPopup').classList.remove('active')}
function toggleMagnifier(){magActive=!magActive;document.getElementById('magBtn').classList.toggle('active',magActive);document.getElementById('imageContainer').classList.toggle('mag-active',magActive);if(!magActive)document.getElementById('magnifier').classList.remove('visible')}
(function(){
  const c=document.getElementById('imageContainer'),m=document.getElementById('magnifier');
  function u(cx,cy){if(!magActive)return;const r=c.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;if(x<0||y<0||x>r.width||y>r.height){m.classList.remove('visible');return}m.classList.add('visible');const ms=m.offsetWidth;m.style.left=(x-ms/2)+'px';m.style.top=(y-ms/2)+'px';const ir=getImgRect();const bw=ir.rw*ZOOM,bh=ir.rh*ZOOM;const imgX=x-ir.ox,imgY=y-ir.oy;m.style.backgroundImage='url('+IMAGE_SRC+')';m.style.backgroundSize=bw+'px '+bh+'px';m.style.backgroundPosition=-(imgX*ZOOM-ms/2)+'px '+-(imgY*ZOOM-ms/2)+'px'}
  c.addEventListener('mousemove',e=>u(e.clientX,e.clientY));
  c.addEventListener('mouseleave',()=>m.classList.remove('visible'));
  c.addEventListener('touchmove',e=>{if(!magActive)return;e.preventDefault();u(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
  c.addEventListener('touchstart',e=>{if(!magActive)return;u(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  c.addEventListener('touchend',()=>m.classList.remove('visible'));
})();
function showWin(){
  document.getElementById('winOverlay').classList.add('active');
  const cl=['#E8A838','#D94E4E','#4CAF50','#3A8CB5','#FF6B9D','#FFD700'];
  for(let i=0;i<50;i++){setTimeout(()=>{const c=document.createElement('div');c.className='confetti-piece';c.style.left=Math.random()*100+'vw';c.style.background=cl[Math.floor(Math.random()*cl.length)];c.style.borderRadius=Math.random()>0.5?'50%':'2px';c.style.width=(6+Math.random()*8)+'px';c.style.height=(6+Math.random()*8)+'px';c.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)},i*50)}
}
function restartGame(){
  document.getElementById('winOverlay').classList.remove('active');
  document.getElementById('progressFill').style.width='0%';
  document.getElementById('progressText').textContent='0 / '+TOTAL_STEPS;
  document.querySelectorAll('.found-marker,.hint-glow').forEach(e=>e.remove());
  activateStep(0);
}
buildGame();
</script>
